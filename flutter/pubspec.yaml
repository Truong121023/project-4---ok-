name: kamatcha_mobile
description: Kamatcha storefront mobile app scaffold from the API guides.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.9
  flutter_map: ^8.2.2
  flutter_html: ^3.0.0
  google_fonts: ^8.0.2
  google_sign_in: ^7.2.0
  geocoding: ^4.0.0
  http: ^1.6.0
  app_links: ^7.0.0
  image_picker: ^1.2.1
  intl: ^0.20.2
  mobile_scanner: ^7.2.0
  path_provider: ^2.1.5
  qr_flutter: ^4.1.0
  shared_preferences: ^2.5.5
  socket_io_client: ^3.1.4
  url_launcher: ^6.3.2
  latlong2: ^0.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/branding/kamatcha-logo.png
